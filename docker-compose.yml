services:
  db:
    image: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: termgif
      MYSQL_ROOT_PASSWORD: superdupersecretpassword
      MYSQL_USER: termgif
      MYSQL_PASSWORD: superdupersecretpassword
    volumes:
      - ./docker/sql/:/docker-entrypoint-initdb.d:rw
    ports:
      - "3306:3306"
  web:
    build:
      network: host
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    depends_on:
      - db
